# MK Sidebar & Ranks | Created by MK
# Colors use MiniMessage: <gold>text</gold>, <bold>text</bold>, or <#ff5555>text</#ff5555>.
# See docs/PLACEHOLDERS.md for all available %placeholders%.
config-version: 7
server-name: 'My Server'
sidebar:
  enabled: true
  title: '<gold><bold>%server_name%</bold></gold>'
  # Minecraft supports at most 15 sidebar lines. Blank/duplicate lines are supported.
  lines:
    - '<white>Name:</white> <aqua>%player_name%</aqua>'
    - '<white>Rank:</white> %player_rank%'
    - '<white>Health:</white> <green>%player_health%/%player_max_health%</green>'
    - '<white>XYZ:</white> <gray>%player_x% %player_y% %player_z%</gray>'
    - '<white>Hours:</white> <aqua>%player_playtime_hours%</aqua>'
    - '<white>Money:</white> %player_balance%'
    - ''
    - '<white>Online:</white> <green>%server_online%/%server_max_players%</green>'
    - '<white>TPS:</white> <green>%server_tps%</green>'
    - '<white>Uptime:</white> <yellow>%server_uptime%</yellow>'
nametags:
  enabled: true
tab:
  enabled: true
  format: '%player_rank_badge% <white>%player_name%</white> <dark_gray>•</dark_gray> %player_ping_color%<gray>ms</gray>'
  footer: '<gray>Credits:</gray> <gold><bold>MK/108e</bold></gold>'
rank-change:
  enabled: true
  announcement: '<gold><bold>RANK CHANGE!</bold></gold> <white>%player_name%</white> <gray>is now</gray> %player_rank%<gray>!</gray>'
promotion:
  hours: 24
  import-existing-playtime: true
  announcement: '<gold><bold>RANK UP!</bold></gold> <white>%player_name%</white> <gray>ranked up to</gray> %player_rank%<gray>!</gray>'
  sound:
    enabled: true
    key: 'minecraft:ui.toast.challenge_complete'
    volume: 0.7
    pitch: 1.0
performance:
  # Sidebar updates are queued about once a second, in bounded batches across server ticks.
  max-updates-per-tick: 32
  # Rank/name changes bypass this delay; ping-only Tab updates are less frequent.
  tab-ping-update-seconds: 5
ranks:
  new_player:
    name: 'New Player'
    color: gray
    bold: false
  og_player:
    name: 'OG Player'
    color: gold
    bold: false
  owner:
    name: 'OWNER'
    color: red
    bold: true
economy:
  # Granted once to each saved player; never reapplied on reconnect or reload.
  starting-balance: 500
auction:
  expire-days: 7
  max-listings-per-player: 5
  max-listings-total: 5000
  sale-fee-percent: 0
coinflip:
  minimum: 1
  maximum: 10000
  challenge-seconds: 60
money-leaderboard:
  enabled: true
  refresh-seconds: 60
market-reminders:
  enabled: true
  interval-seconds: 120
  messages:
    - '<gold><bold>MK »</bold></gold> <white>Buy and sell items with</white> <click:run_command:/auction><aqua>/auction</aqua></click><white>! Challenge a player:</white> <aqua>/coinflip Alex 50</aqua>'
    - '<gold><bold>MK »</bold></gold> <white>Challenge a player:</white> <aqua>/coinflip Alex 50</aqua><white>. Check the richest players with</white> <click:run_command:/baltop><aqua>/baltop</aqua></click><white>! Trade items with</white> <click:run_command:/auction><aqua>/auction</aqua></click><white>.</white>'
