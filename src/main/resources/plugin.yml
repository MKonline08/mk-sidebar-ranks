name: MKSidebarRanks
version: '1.6.0'
main: io.github.mkonline08.sidebar.MKSidebarPlugin
api-version: '1.21.11'
description: Stylish sidebar, Tab ping and ranks, and automatic playtime promotions.
author: MK
website: https://github.com/MKonline08/mk-sidebar-ranks
commands:
  auction:
    description: Fixed-price market, your listings and item mailbox
    aliases: [ah]
    usage: /auction [sell <price>|mine|mail|cancel <ID>]
    permission: mksidebar.market
  money:
    description: Wallet balance and transaction history
    aliases: [balance, bal]
    usage: /money [history [page]]
    permission: mksidebar.market
  pay:
    description: Transfer money to a saved player
    usage: /pay <player|UUID> <amount>
    permission: mksidebar.market
  baltop:
    description: Top ten money balances
    permission: mksidebar.market
  coinflip:
    description: Public coin flip lobby with animated matches
    usage: /coinflip [create <amount>|cancel]
    permission: mksidebar.market
  mkmarket:
    description: Admin money, spawn leaderboard and recovery tools
    usage: /mkmarket money|leaderboard|recovery|performance
    permission: mksidebar.admin
  rank:
    description: View your rank, playtime, and progress toward OG
    usage: /rank
    permission: mksidebar.rank
  mksb:
    description: Sidebar toggle and configuration reload
    usage: /mksb <toggle|reload>
  mkrank:
    description: Manage colored player ranks
    usage: /mkrank <list|create|color|set|reset|info|testsound>
    permission: mksidebar.admin
permissions:
  mksidebar.market:
    description: Wallet, payments, market, coin flips and public money leaderboard
    default: true
  mksidebar.rank:
    description: View your own rank and playtime progress
    default: true
  mksidebar.admin:
    description: Manage ranks and reload configuration
    default: op
  mksidebar.toggle:
    description: Toggle your own sidebar
    default: true
