name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test, and package
        run: mvn -B -ntp clean verify
      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: mk-sidebar-ranks
          path: target/mk-sidebar-ranks-1.2.1.jar
          if-no-files-found: error
